name: Curate orphan articles

# Manual only — deliberately not scheduled. There are ~918 orphans queued, and
# working that backlog down unattended, 30 at a time, would churn the vault
# faster than the results can be reviewed. Curation is better driven by hand
# (locally, or by dispatching this) when there's appetite to review the output.
on:
  workflow_dispatch: {}

# Shares the vault-write group with ingest-video.yml — see the note there.
concurrency:
  group: vault-write
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      # claude-code-action fetches an OIDC token; without this it fails with
      # "Could not fetch an OIDC token" before Claude ever starts.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the pre-push rebase below has a real base to work from.
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Use the article-curator agent to process the next batch of orphan entries."
          # v1 has no `allowed_tools` input — tool config goes through claude_args.
          # Task is load-bearing here: the curator is an orchestrator that dispatches
          # three parallel worker subagents. Bash backs its grep/rm/csv work.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,Task,WebSearch,WebFetch,TodoWrite"
            --max-turns 300

      - name: Commit and push any changes
        run: |
          set -euo pipefail
          git config user.name "uap-gerb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A "UAP Gerb Knowledge Base" .claude/agent-memory orphans.csv
          if git diff --cached --quiet; then
            echo "No vault changes — nothing to commit."
            exit 0
          fi
          git commit -m "Auto-curate: orphan article pass"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# Site rebuild: no step needed here. The Nuxt app in app/ bakes vault content into
# the server bundle at build time, so new markdown only reaches the live site on a
# rebuild — but the Netlify site is linked to this repo and builds on push to main.
# That build is triggered by Netlify's own webhook, not GitHub Actions, so the
# "pushes made with GITHUB_TOKEN don't trigger workflows" restriction does not apply.
# If a content-only push ever stops rebuilding, check for a Netlify `ignore` command
# scoped to app/ — that is the setting that would skip vault-only changes.
