name: Ingest new videos

on:
  schedule:
    - cron: '0 * * * *'   # hourly
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install video/transcript tooling
        run: pip install --break-system-packages yt-dlp youtube-transcript-api

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Use the video-ingestor agent to process any new video."
          allowed_tools: "Bash,Read,Edit,Write"

      - name: Commit and push any changes
        run: |
          git config user.name "uap-gerb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "UAP Gerb Knowledge Base" .claude/agent-memory orphans.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Auto-ingest: new video"
          git push

