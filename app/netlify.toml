# Netlify's default with a base directory is to skip any build where nothing
# under app/ changed. The site is built from the vault beside it, though (see
# wiki/vault.ts), so a commit that only adds a processed video or edits a note
# must still deploy. Build when either tree changed. Exit 1 = build, 0 = skip.
[build]
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . '../UAP Gerb Knowledge Base'"
